name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Setup Node.js with npm cache
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'npm'

      # Install dependencies
      - run: npm ci

      # Setup NX cloud (optional - uncomment to enable)
      # - run: npx nx-cloud start-ci-run --distribute-on="5 linux-medium-js" --stop-agents-after="e2e-ci"
      - uses: nrwl/nx-set-shas@v5

      # Install Playwright browsers and OS dependencies for e2e tests
      - name: Install Playwright
        run: npx playwright install --with-deps

      # Lint (oxlint)
      - name: Lint code
        run: npm run lint

      # Format check (oxfmt)
      - name: Check formatting
        run: npm run format:check

      # Test (Vitest)
      - name: Run tests
        run: npx nx affected -t test --base=origin/develop --parallel 1 --verbose

      # Build
      - name: Build packages
        run: npx nx affected -t build --base=origin/develop --parallel 1 --verbose

      # E2E (Playwright)
      - name: Run e2e tests
        run: npx nx affected -t e2e --base=origin/develop --parallel 1 --verbose
