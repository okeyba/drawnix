name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Setup Node.js with npm cache
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'npm'

      # Install dependencies
      - run: npm ci

      # Setup NX cloud (optional - uncomment to enable)
      # - run: npx nx-cloud start-ci-run --distribute-on="5 linux-medium-js" --stop-agents-after="e2e-ci"
      - uses: nrwl/nx-set-shas@v5

      # Lint (oxlint + oxfmt)
      - name: Lint code
        run: npm run lint

      # Test (Vitest)
      - name: Run tests
        run: npx nx affected -t test --base=origin/develop --parallel auto --verbose

      # Build
      - name: Build packages
        run: npx nx affected -t build --base=origin/develop --parallel auto --verbose
